const questions=[{"r": 0, "t": "Главный закон", "q": "Какой свод законов приняли в 1649 году при Алексее Михайловиче?", "a": ["Соборное уложение", "Судебник Ивана III", "Русская Правда", "Табель о рангах"], "c": 0, "e": "Соборное уложение приняли в 1649 году. Оно стало главным сводом законов России XVII века.", "m": "1649 • СОБОРНОЕ УЛОЖЕНИЕ"}, {"r": 0, "t": "Крестьяне и закон", "q": "Что установило Соборное уложение 1649 года в отношении беглых крестьян?", "a": ["Полную свободу перехода к другому владельцу", "Бессрочный сыск беглых крестьян", "Отмену крепостного права", "Освобождение всех крестьян от податей"], "c": 1, "e": "Бессрочный сыск означал, что владельцы могли разыскивать и возвращать беглых крестьян без ограничения срока. Это закрепило крепостную зависимость.", "m": "БЕССРОЧНЫЙ СЫСК • КРЕПОСТНОЕ ПРАВО"}, {"r": 0, "t": "Соль дороже золота?", "q": "Как назывался московский бунт 1648 года?", "a": ["Чумной бунт", "Медный бунт", "Соляной бунт", "Стрелецкий бунт"], "c": 2, "e": "В 1648 году в Москве произошёл Соляной бунт. Недовольство было связано с налоговой политикой и злоупотреблениями властей.", "m": "1648 • СОЛЯНОЙ БУНТ"}, {"r": 0, "t": "Монеты вызвали протест", "q": "С каким событием связан выпуск медных денег по стоимости серебряных при Алексее Михайловиче?", "a": ["Восстание декабристов", "Восстание Пугачёва", "Соляной бунт 1648 года", "Медный бунт 1662 года"], "c": 3, "e": "Медные деньги обесценивались, росли цены и недовольство населения. В 1662 году в Москве произошёл Медный бунт.", "m": "1662 • МЕДНЫЙ БУНТ"}, {"r": 0, "t": "Кто начал реформу?", "q": "Какой патриарх начал церковную реформу при Алексее Михайловиче?", "a": ["Никон", "Филарет", "Гермоген", "Иов"], "c": 0, "e": "Патриарх Никон начал исправление церковных книг и обрядов по греческим образцам. Реформа привела к церковному расколу.", "m": "НИКОН • ЦЕРКОВНАЯ РЕФОРМА"}, {"r": 1, "t": "Рада собирается", "q": "В каком году состоялась Переяславская рада?", "a": ["1613", "1654", "1682", "1700"], "c": 1, "e": "Переяславская рада состоялась в 1654 году. На ней было принято решение о переходе Войска Запорожского под власть русского царя.", "m": "1654 • ПЕРЕЯСЛАВСКАЯ РАДА"}, {"r": 1, "t": "Противник на западе", "q": "С каким государством Россия воевала в 1654–1667 годах?", "a": ["С Китаем", "С Османской империей", "С Речью Посполитой", "Со Швецией"], "c": 2, "e": "Русско-польская война 1654–1667 годов велась с Речью Посполитой. Её завершило Андрусовское перемирие.", "m": "1654–1667 • РЕЧЬ ПОСПОЛИТАЯ"}, {"r": 1, "t": "Договор в Андрусове", "q": "Какой договор завершил русско-польскую войну 1654–1667 годов?", "a": ["Кардисский мир", "Нерчинский договор", "Бахчисарайский мир", "Андрусовское перемирие"], "c": 3, "e": "Андрусовское перемирие заключили в 1667 году. Важно запомнить: Андрусово связано с Речью Посполитой.", "m": "1667 • АНДРУСОВСКОЕ ПЕРЕМИРИЕ"}, {"r": 1, "t": "Что получила Россия?", "q": "Какой вариант верно называет приобретения России по Андрусовскому перемирию?", "a": ["Смоленск и Левобережная Украина; Киев передавался временно", "Крым и выход к Чёрному морю", "Рига и выход к Балтийскому морю", "Казань и Астрахань"], "c": 0, "e": "За Россией закреплялись Смоленск и Левобережная Украина. Киев первоначально передавался на два года, но остался за Россией.", "m": "АНДРУСОВО • СМОЛЕНСК И ЛЕВОБЕРЕЖЬЕ"}, {"r": 1, "t": "Балтийский вопрос", "q": "Каков результат Кардисского мира 1661 года со Швецией?", "a": ["Россия получила Ригу", "Россия вернула завоевания Швеции и не получила выхода к Балтике", "Швеция передала России Крым", "Россия получила Азов"], "c": 1, "e": "Кардисский мир вернул границу к условиям Столбовского мира. Завоёванные в войне шведские владения пришлось вернуть; выхода к Балтике Россия не получила.", "m": "1661 • КАРДИССКИЙ МИР • ШВЕЦИЯ"}, {"r": 2, "t": "Реформа молодого царя", "q": "Что отменили в 1682 году при Фёдоре Алексеевиче?", "a": ["Патриаршество", "Крепостное право", "Местничество", "Самодержавие"], "c": 2, "e": "В 1682 году отменили местничество. Разрядные книги, использовавшиеся для местнических споров, сожгли.", "m": "1682 • ОТМЕНА МЕСТНИЧЕСТВА"}, {"r": 2, "t": "Важен род или способности?", "q": "Что означало местничество, отменённое при Фёдоре Алексеевиче?", "a": ["Разделение страны на губернии", "Сбор налога с каждой мужской души", "Выбор царя на Земском соборе", "Назначение на должности с учётом знатности рода и службы предков"], "c": 3, "e": "При местничестве положение на службе зависело от происхождения и службы предков. Его отмена ослабила значение родовитости при назначениях.", "m": "МЕСТНИЧЕСТВО • ЗНАТНОСТЬ РОДА"}, {"r": 2, "t": "С чего собирают налог?", "q": "Какая единица обложения стала основной при введении подворного налогообложения в 1679 году?", "a": ["Двор", "Каждая мужская душа", "Каждый торговый корабль", "Губерния"], "c": 0, "e": "Подворное налогообложение использовало двор как единицу обложения. Не путайте его с подушной податью, введённой позднее при Петре I.", "m": "1679 • ПОДВОРНОЕ ОБЛОЖЕНИЕ"}, {"r": 2, "t": "Война на юге", "q": "С кем Россия воевала в русско-турецкой войне 1676–1681 годов?", "a": ["С Китаем и Монголией", "С Османской империей и Крымским ханством", "Со Швецией и Данией", "С Францией и Англией"], "c": 1, "e": "Противниками России были Османская империя и Крымское ханство. Война завершилась Бахчисарайским миром 1681 года.", "m": "1676–1681 • ОСМАНСКАЯ ИМПЕРИЯ"}, {"r": 2, "t": "Мир в Бахчисарае", "q": "Какой договор завершил русско-турецкую войну 1676–1681 годов?", "a": ["Вечный мир", "Кардисский мир", "Бахчисарайский мир", "Андрусовское перемирие"], "c": 2, "e": "Бахчисарайский мир заключили в 1681 году при Фёдоре Алексеевиче. Он устанавливал двадцатилетнее перемирие; граница проходила по Днепру.", "m": "1681 • БАХЧИСАРАЙСКИЙ МИР"}, {"r": 3, "t": "Два царя и правительница", "q": "При каких царях Софья Алексеевна была регентшей?", "a": ["При Михаиле Фёдоровиче и Алексее Михайловиче", "При Фёдоре Алексеевиче и Иване IV", "При Петре I и Петре II", "При Иване V и Петре I"], "c": 3, "e": "Софья управляла государством в 1682–1689 годах при своих братьях Иване V и Петре I. Она была регентшей, а не венчанной на царство царицей.", "m": "1682–1689 • СОФЬЯ • РЕГЕНТСТВО"}, {"r": 3, "t": "Стрельцы и власть", "q": "Какое событие помогло Софье прийти к власти в 1682 году?", "a": ["Стрелецкое восстание", "Восстание декабристов", "Медный бунт", "Восстание Пугачёва"], "c": 0, "e": "Стрелецкое восстание 1682 года сопровождалось борьбой придворных группировок. После него Иван и Пётр стали соправителями, а Софья — регентшей.", "m": "1682 • СТРЕЛЕЦКОЕ ВОССТАНИЕ"}, {"r": 3, "t": "Мир навечно", "q": "С каким государством Россия заключила Вечный мир в 1686 году?", "a": ["Со Швецией", "С Речью Посполитой", "С Китаем", "С Османской империей"], "c": 1, "e": "Вечный мир 1686 года заключили с Речью Посполитой при правительстве Софьи. Он подтвердил основные условия Андрусовского перемирия и окончательно закрепил Киев за Россией.", "m": "1686 • ВЕЧНЫЙ МИР • РЕЧЬ ПОСПОЛИТАЯ"}, {"r": 3, "t": "Учиться в Москве", "q": "Какое учебное заведение открылось в Москве в 1687 году, в период регентства Софьи?", "a": ["Царскосельский лицей", "Московский университет", "Славяно-греко-латинская академия", "Смольный институт"], "c": 2, "e": "В 1687 году открылась Славяно-греко-латинская академия. Её создание готовилось ещё при Фёдоре Алексеевиче, а открытие состоялось при Софье.", "m": "1687 • СЛАВЯНО-ГРЕКО-ЛАТИНСКАЯ АКАДЕМИЯ"}, {"r": 3, "t": "Договор на востоке", "q": "С какой страной Россия заключила Нерчинский договор 1689 года?", "a": ["С Речью Посполитой", "Со Швецией", "С Османской империей", "С Китаем"], "c": 3, "e": "Нерчинский договор 1689 года заключили с Цинской империей, то есть с Китаем. Он регулировал пограничные и торговые отношения.", "m": "1689 • НЕРЧИНСКИЙ ДОГОВОР • КИТАЙ"}, {"r": 4, "t": "Не перепутайте договоры", "q": "Какое перемирие Россия заключила со Швецией в 1658 году?", "a": ["Валиесарское", "Андрусовское", "Деулинское", "Виленское"], "c": 0, "e": "Валиесарское перемирие 1658 года остановило боевые действия со Швецией. Затем в 1661 году заключили Кардисский мир.", "m": "ШВЕЦИЯ: 1658 ВАЛИЕСАРИ → 1661 КАРДИС"}, {"r": 4, "t": "Крепость на Днепре", "q": "Оборона какого города была связана с походами 1677 и 1678 годов во время русско-турецкой войны?", "a": ["Риги", "Чигирина", "Смоленска", "Казани"], "c": 1, "e": "Чигиринские походы относятся к 1677–1678 годам и правлению Фёдора Алексеевича. Они связаны с борьбой за Чигирин во время войны с Османской империей.", "m": "1677–1678 • ЧИГИРИНСКИЕ ПОХОДЫ"}, {"r": 4, "t": "Кто командовал походами?", "q": "Кто возглавлял русское войско в Крымских походах 1687 и 1689 годов при Софье?", "a": ["Степан Разин", "Александр Меншиков", "Василий Голицын", "Михаил Скопин-Шуйский"], "c": 2, "e": "Крымские походы 1687 и 1689 годов возглавлял Василий Васильевич Голицын, один из главных деятелей правительства Софьи.", "m": "1687 И 1689 • КРЫМСКИЕ ПОХОДЫ • ГОЛИЦЫН"}, {"r": 4, "t": "Итог Крымских походов", "q": "Чем закончились Крымские походы 1687 и 1689 годов?", "a": ["Крым вошёл в состав России", "Россия получила Ригу", "Был взят Азов", "Поставленная цель не была достигнута"], "c": 3, "e": "Оба Крымских похода оказались неудачными. Присоединения Крыма и взятия Азова тогда не произошло.", "m": "КРЫМСКИЕ ПОХОДЫ • НЕУДАЧА"}, {"r": 4, "t": "Финальная дата", "q": "В каком году завершилось регентство Софьи и началось её отстранение от власти в пользу Петра I?", "a": ["1689", "1649", "1667", "1721"], "c": 0, "e": "В 1689 году Софья потеряла власть и была удалена в Новодевичий монастырь. Иван V формально оставался соправителем Петра I до 1696 года.", "m": "1689 • ОТСТРАНЕНИЕ СОФЬИ"}];

(()=>{'use strict';
const app=document.getElementById('app'),KEY='romanovs-chronicle-25-v1';let state=null,selection=null,canSave=true;
const shuffle=items=>{const arr=[...items];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr};
const valid=s=>s&&s.v===1&&Number.isInteger(s.i)&&s.i>=0&&s.i<=25&&Array.isArray(s.answers)&&s.answers.length===(s.i===25?25:s.i+(s.answers.length>s.i?1:0))&&s.answers.every(n=>Number.isInteger(n)&&n>=0&&n<4)&&Array.isArray(s.orders)&&s.orders.length===25&&s.orders.every(o=>Array.isArray(o)&&o.length===4&&new Set(o).size===4&&o.every(n=>Number.isInteger(n)&&n>=0&&n<4));
try{const saved=JSON.parse(localStorage.getItem(KEY));if(valid(saved))state=saved}catch{canSave=false}
const score=()=>state?state.answers.reduce((n,a,i)=>n+Number(a===questions[i].c),0):0;
const roundScore=r=>questions.reduce((n,q,i)=>n+Number(q.r===r&&state.answers[i]===q.c),0);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{canSave=false}}
function scrollTop(){window.scrollTo(0,0)}
function bind(id,handler){const el=document.getElementById(id);if(el)el.onclick=handler}
function home(){const resume=state?`<button class="btn secondary small" id="restart">Новая попытка</button>`:'';app.innerHTML=`<section class="hero enter"><div><span class="small-pill"><i class="small-dot"></i> ИСТОРИЧЕСКАЯ ИГРА · ЕГЭ</span><h1>Дела царские.<br><span>Ваша летопись.</span></h1><p class="intro">Законы и бунты, войны и миры. Пройдите путь от Алексея Михайловича до правления Софьи и соберите 25 верных решений.</p><div class="stats"><div><b>25</b><small>лёгких вопросов</small></div><div><b>5</b><small>раундов</small></div><div><b>25</b><small>баллов максимум</small></div></div><div class="actions"><button class="btn gold" id="start">${state?(state.i===25?'Посмотреть результат':'Продолжить игру'):'Начать игру'}</button>${resume}</div><p class="micro">Один верный ответ · Без таймера · С объяснениями</p>${state?`<p class="micro">Сохранённая попытка: ${state.answers.length} из 25 проверено. Баллы: ${score()} / 25.</p>`:''}</div><div class="portrait-stack" aria-label="Правители изучаемой эпохи"><div class="portrait-card"><span class="ruler-mark" aria-hidden="true">А</span><div><b>Алексей<br>Михайлович</b><small>ЗАКОНЫ · РАСКОЛ · ВОЙНЫ</small></div><span class="date">1645–1676</span></div><div class="portrait-card"><span class="ruler-mark" aria-hidden="true">Ф</span><div><b>Фёдор<br>Алексеевич</b><small>РЕФОРМЫ · МИР НА ЮГЕ</small></div><span class="date">1676–1682</span></div><div class="portrait-card"><span class="ruler-mark" aria-hidden="true">С</span><div><b>Софья<br>Алексеевна</b><small>РЕГЕНТСТВО · ДИПЛОМАТИЯ</small></div><span class="date">1682–1689</span></div><div class="seal">РОССИЯ · ВТОРАЯ ПОЛОВИНА XVII ВЕКА</div></div></section><div class="section-head"><h2>Пять глав летописи</h2><small>В каждой главе 5 вопросов</small></div><section class="route" aria-label="Темы игры">${rounds.map(r=>`<article class="route-card"><span class="no">${r.no}</span><h3>${r.name}</h3><p>${r.desc}</p></article>`).join('')}</section><div class="rules"><strong>Как играть</strong><br>В каждом вопросе выберите один ответ и нажмите «Проверить». За верный ответ начисляется 1 балл, за ошибку — 0. После проверки ответ изменить нельзя. Прочитайте объяснение и перейдите дальше. В финале вас ждут результат из 25 баллов, разбор ошибок и памятки для повторения.</div>`;bind('start',()=>{if(!state)start();else if(state.i===25)result();else render();scrollTop()});bind('restart',restart);scrollTop()}
function start(){state={v:1,i:0,answers:[],orders:questions.map(()=>shuffle([0,1,2,3])),started:new Date().toISOString()};selection=null;save();render()}
function restart(){if(confirm('Начать новую попытку? Сохранённый результат будет заменён.')){start();scrollTop()}}
function render(){if(state.i===25){result();return}const i=state.i,q=questions[i],answered=i<state.answers.length;selection=answered?state.answers[i]:null;app.innerHTML=`<div class="game-layout enter"><aside class="sidebar"><span class="eyebrow">ДЕЛА ЦАРСКИЕ</span><h2>Пишите свою<br>летопись.</h2>${rounds.map((r,n)=>`<div class="step ${n===q.r?'active':n<q.r?'done':''}"><span class="step-no">${n<q.r?'✓':r.no}</span><div><strong>${r.name}</strong><small>Вопросы ${n*5+1}–${n*5+5}</small></div></div>`).join('')}<div class="side-score"><small>Ваши баллы</small><b id="side-points">${score()}</b><span> / 25</span></div><p class="micro">${canSave?'Прогресс сохраняется в этом браузере.':'Сохранение недоступно. Не закрывайте страницу до конца игры.'}</p><p><button class="btn secondary small" id="home">На главную</button></p></aside><section><div class="topline"><span>ГЛАВА ${q.r+1} / 5 · ${rounds[q.r].name}</span><span>ВОПРОС ${i+1} / 25</span></div><div class="progress" role="progressbar" aria-label="Проверено вопросов" aria-valuenow="${state.answers.length}" aria-valuemin="0" aria-valuemax="25"><div style="width:${state.answers.length*4}%"></div></div><article class="q-card"><div class="q-labels"><span class="tag">ОДИН ВЕРНЫЙ ОТВЕТ</span><small>1 балл за вопрос</small></div><h1>${q.t}</h1><p class="q-text">${q.q}</p><div class="choices" role="group" aria-label="Варианты ответа">${state.orders[i].map((n,j)=>`<button class="choice" type="button" data-answer="${n}" aria-pressed="false"><span class="marker">${j+1}</span><span>${q.a[n]}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="q-actions"><small id="status">Выберите один вариант.</small><button class="btn" id="check" disabled>Проверить</button></div></article><p class="mobile-score">Баллы: <b id="points">${score()}</b> из 25 · Проверено: <span id="answered">${state.answers.length}</span> из 25</p><button class="btn secondary small" id="mobile-home">На главную</button></section></div>`;bind('home',home);bind('mobile-home',home);document.querySelectorAll('.choice').forEach(b=>{b.onclick=()=>{if(i<state.answers.length)return;selection=Number(b.dataset.answer);paint(false)}});bind('check',()=>{if(i<state.answers.length){state.i++;selection=null;save();render();scrollTop()}else if(selection!==null){state.answers.push(selection);save();paint(true);document.getElementById('feedback').scrollIntoView({block:'nearest',behavior:'smooth'})}});paint(answered)}
function paint(answered){const q=questions[state.i];document.querySelectorAll('.choice').forEach(b=>{const n=Number(b.dataset.answer);b.classList.toggle('sel',n===selection);b.classList.toggle('right',answered&&n===q.c);b.classList.toggle('wrong',answered&&n===selection&&n!==q.c);b.disabled=answered;b.setAttribute('aria-pressed',String(n===selection));if(answered&&n===q.c)b.querySelector('.marker').textContent='✓';else if(answered&&n===selection)b.querySelector('.marker').textContent='×'});const check=document.getElementById('check');check.disabled=selection===null;document.getElementById('status').textContent=answered?'Ответ сохранён.':selection===null?'Выберите один вариант.':'Ответ выбран. Нажмите «Проверить».';if(answered){const ok=selection===q.c;document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><b>${ok?'Верно! В летопись +1 балл':'Пока 0 баллов. Запомним ответ.'}</b>${ok?'':`<p>Правильный ответ: ${q.a[q.c]}.</p>`}${q.e}<div class="memory">${q.m}</div></div>`;check.textContent=state.i===24?'Узнать результат':(state.i+1)%5===0?'Следующая глава':'Дальше';document.getElementById('points').textContent=score();document.getElementById('side-points').textContent=score();document.getElementById('answered').textContent=state.answers.length;const bar=document.querySelector('[role="progressbar"]');bar.setAttribute('aria-valuenow',state.answers.length);bar.firstElementChild.style.width=state.answers.length*4+'%'}}
function study(){return `<section class="study"><div class="section-head"><h2>Для повторения</h2><small>Памятки после игры</small></div><details><summary>Алексей Михайлович: войны и договоры</summary><img src="${assets.alexei}" alt="Учебная схема: войны Алексея Михайловича, Валиесарское и Андрусовское перемирия, Кардисский мир" loading="lazy"><p class="study-note">Боевые действия со Швецией: 1656–1658 годы. Валиесарское перемирие: 1658 год. Окончательный мир в Кардисе: 1661 год.</p></details><details><summary>Фёдор Алексеевич: реформы и внешняя политика</summary><img src="${assets.fedor}" alt="Учебная схема: внутренняя и внешняя политика Фёдора Алексеевича" loading="lazy"></details><details><summary>Софья Алексеевна: пять опорных фактов</summary><p>1682–1689: регентство при Иване V и Петре I.<br>1686: Вечный мир с Речью Посполитой.<br>1687: открытие Славяно-греко-латинской академии.<br>1687 и 1689: неудачные Крымские походы Василия Голицына.<br>1689: Нерчинский договор с Китаем и отстранение Софьи от власти.</p></details><details><summary>Источники для проверки фактов</summary><p>Игра подготовлена с опорой на учебные схемы преподавателя. Дополнительная сверка:</p><ul><li><a href="https://www.prlib.ru/history/619127" target="_blank" rel="noopener">Президентская библиотека: Алексей Михайлович</a></li><li><a href="https://old.bigenc.ru/domestic_history/text/3588630" target="_blank" rel="noopener">БРЭ: Соборное уложение 1649 года</a></li><li><a href="https://www.prlib.ru/node/619017" target="_blank" rel="noopener">Президентская библиотека: Андрусовское перемирие</a></li><li><a href="https://old.bigenc.ru/domestic_history/text/2046232" target="_blank" rel="noopener">БРЭ: Кардисский мир</a></li><li><a href="https://old.bigenc.ru/domestic_history/text/3149354" target="_blank" rel="noopener">БРЭ: подворное обложение</a></li><li><a href="https://base.garant.ru/58103866/" target="_blank" rel="noopener">Соборное деяние об отмене местничества</a></li><li><a href="https://nav.shm.ru/exhibits/4466/" target="_blank" rel="noopener">Исторический музей: Славяно-греко-латинская академия</a></li><li><a href="https://www.prlib.ru/node/619576" target="_blank" rel="noopener">Президентская библиотека: Софья Алексеевна</a></li></ul></details></section>`}
function result(){const total=score(),mistakes=25-total,title=total>=23?'Летописец царских дел':total>=18?'Знаток XVII века':total>=13?'Летопись пополняется':'Первый свиток написан';app.innerHTML=`<div class="enter"><section class="result-hero"><div><span class="eyebrow">25 ВОПРОСОВ ПРОЙДЕНО</span><h1>${title}</h1><p>${total===25?'Все ответы верны! Законы, войны и договоры заняли свои места в вашей летописи.':`Верных ответов: ${total}. Ошибок: ${mistakes}. Откройте разбор и повторите факты, которые пока путаются.`}</p><span class="small-pill">${total*4}% ВЕРНЫХ ОТВЕТОВ</span></div><div class="score-disc"><b>${total}</b><small>из 25 баллов</small></div></section><div class="actions result-actions"><button class="btn" id="copy">Скопировать результат</button><button class="btn secondary" id="restart">Пройти ещё раз</button><button class="btn secondary" id="home">На главную</button></div><p id="copy-note" class="micro" aria-live="polite"></p><div class="section-head"><h2>Результат по главам</h2><small>До 5 баллов за главу</small></div><div class="by-round">${rounds.map((r,n)=>`<div class="round-result">${r.no} · ${r.name}<b>${roundScore(n)} / 5</b></div>`).join('')}</div><div class="section-head"><h2>Разбор ответов</h2><small>Нажмите на вопрос</small></div><div class="filter-row"><button class="btn secondary small active" id="all">Все вопросы</button><button class="btn secondary small" id="errors">Только ошибки (${mistakes})</button></div><div id="review"></div>${study()}<div class="rules">Чтобы передать результат преподавателю, скопируйте его или сделайте скриншот. Баллы игры не переводятся в оценку ЕГЭ. ${canSave?'Результат сохраняется только в этом браузере.':'Автоматическое сохранение недоступно в этом браузере.'}</div></div>`;bind('restart',restart);bind('home',home);bind('copy',copyResult);bind('all',()=>showReview(false));bind('errors',()=>showReview(true));showReview(false)}
function showReview(onlyErrors){const list=questions.map((q,i)=>({q,i,ok:state.answers[i]===q.c})).filter(x=>!onlyErrors||!x.ok);document.getElementById('all').classList.toggle('active',!onlyErrors);document.getElementById('errors').classList.toggle('active',onlyErrors);document.getElementById('review').innerHTML=list.length?list.map(({q,i,ok})=>`<details class="review-item"><summary><span class="${ok?'good-mark':'bad-mark'}">${ok?'✓':'×'} ${i+1}. ${q.t} · ${ok?1:0} / 1</span></summary><p>${q.q}</p><p>Ваш ответ: ${q.a[state.answers[i]]}.</p><p class="correct-answer">Правильный ответ: ${q.a[q.c]}.</p><p>${q.e}</p><div class="memory">${q.m}</div></details>`).join(''):'<div class="no-errors">Ошибок нет. Все 25 ответов верны!</div>'}
async function copyResult(){const text='Дела царские: Алексей, Фёдор, Софья\nМой результат: '+score()+' из 25 баллов ('+score()*4+'%).\n'+rounds.map((r,n)=>r.name+': '+roundScore(n)+' из 5').join('\n');try{await navigator.clipboard.writeText(text);document.getElementById('copy-note').textContent='Результат скопирован. Его можно отправить преподавателю.'}catch{document.getElementById('copy-note').innerHTML='<label>Скопируйте результат из поля:<br><textarea id="copy-field" rows="8" style="width:100%;padding:12px;margin-top:10px"></textarea></label>';const field=document.getElementById('copy-field');field.value=text;field.focus();field.select()}}
document.getElementById('brand').onclick=()=>{home();return false};home();
})();
</script></body></html>
